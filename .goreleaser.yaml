# https://goreleaser.com — run by the release workflow on tags.
version: 2
project_name: exhale
before:
  hooks:
    - sh -c "cd web && pnpm install --frozen-lockfile && pnpm build"
builds:
  - &build
    id: exhale
    main: ./cmd/exhale
    env: [CGO_ENABLED=0]
    flags: [-trimpath]
    ldflags: ["-s -w -X main.version={{.Version}}"]
    goos: [linux, darwin, windows]
    goarch: [amd64, arm64]
  # 32-bit Raspberry Pi OS. A build of its own so its packages can go
  # without exhale-window, which is built for amd64 and arm64 only (ADR 0030).
  - <<: *build
    id: exhale-armv7
    goos: [linux]
    goarch: [arm]
    goarm: ["7"]
archives:
  - formats: [tar.gz]
    # scripts/install.sh relies on this name: exhale_<version>_<os>_<arch>,
    # with arch amd64, arm64 or armv7.
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}"
    format_overrides:
      - { goos: windows, formats: [zip] }
    # The service definitions travel with the binary, so the installer uses
    # files covered by the release checksum.
    files:
      - LICENSE
      - README.md
      - deploy/systemd/exhale.service
      - deploy/systemd/exhale.env
      - deploy/launchd/io.github.akamachinecode.exhale.plist
checksum:
  name_template: checksums.txt
  # Exhale.dmg and Exhale-Setup.exe, built by the installers workflow on
  # macOS and Linux before this runs (ADR 0029).
  extra_files:
    - glob: ./installers/*
sboms:
  - artifacts: archive
signs:
  - cmd: cosign
    signature: "${artifact}.sigstore.json"
    args: [sign-blob, "--bundle=${signature}", "${artifact}", --yes]
    artifacts: checksum
nfpms:
  # amd64 and arm64: the server and exhale-window, Exhale's own window
  # (ADR 0030), built with GTK 4 by the installers workflow into window/.
  - &nfpm
    id: packages
    ids: [exhale]
    package_name: exhale
    vendor: Exhale
    homepage: https://github.com/akamachinecode/exhale
    maintainer: akamachinecode
    description: Self-hosted subscription manager where the notification is the interface.
    license: AGPL-3.0-or-later
    formats: [deb, rpm]
    section: utils
    bindir: /usr/bin
    # The same name in every release (exhale_linux_amd64.deb), so the
    # download page links to releases/latest/download/<name> (ADR 0029).
    file_name_template: "{{ .PackageName }}_{{ .Os }}_{{ .Arch }}{{ if .Arm }}v{{ .Arm }}{{ end }}"
    # A working service: unit, settings file and a dedicated user. Data lives
    # in /var/lib/exhale and is never removed by the package (docs/install/linux.md).
    contents:
      - &unit
        src: deploy/systemd/exhale.service
        dst: /usr/lib/systemd/system/exhale.service
        file_info: { mode: 0644 }
      - &env
        src: deploy/systemd/exhale.env
        dst: /etc/exhale/exhale.env
        type: config|noreplace
        file_info: { mode: 0640, group: exhale } # the group is created by preinstall
      - &license
        src: LICENSE
        dst: /usr/share/licenses/exhale/LICENSE
        type: license
      # Exhale in the app launcher, and its icon (ADR 0029). Named after the
      # window's app id, so the dock matches the two (ADR 0030).
      - &launcher
        src: deploy/packaging/io.github.akamachinecode.exhale.desktop
        dst: /usr/share/applications/io.github.akamachinecode.exhale.desktop
        file_info: { mode: 0644 }
      - &icon
        src: deploy/desktop/icon.svg
        dst: /usr/share/icons/hicolor/scalable/apps/exhale.svg
        file_info: { mode: 0644 }
      # The service may keep the computer awake when the owner asks (ADR 0028).
      - &polkit
        src: deploy/packaging/50-exhale.rules
        dst: /usr/share/polkit-1/rules.d/50-exhale.rules
        file_info: { mode: 0644 }
      # `exhale open` runs it when it sits next to it; without its libraries
      # (a server with no desktop) the browser opens instead.
      - src: "window/exhale-window_linux_{{ .Arch }}"
        dst: /usr/bin/exhale-window
        file_info: { mode: 0755 }
    scripts:
      preinstall: deploy/packaging/preinstall.sh
      postinstall: deploy/packaging/postinstall.sh
      preremove: deploy/packaging/preremove.sh
      postremove: deploy/packaging/postremove.sh
    # The window's libraries, which every desktop already has. Recommended,
    # not required: a server installs without them.
    overrides:
      deb:
        recommends: [libgtk-4-1, libwebkitgtk-6.0-4]
      rpm:
        recommends: [gtk4, webkitgtk6.0]
  # armv7: the same packages without the window; Exhale opens in the browser.
  - <<: *nfpm
    id: packages-armv7
    ids: [exhale-armv7]
    contents: [*unit, *env, *license, *launcher, *icon, *polkit]
    overrides: {}
dockers_v2:
  - images: ["ghcr.io/akamachinecode/exhale"]
    dockerfile: deploy/Dockerfile
    platforms: [linux/amd64, linux/arm64, linux/arm/v7]
    # vX.Y.Z, vX.Y, vX and latest (ADR 0016).
    tags: ["v{{ .Version }}", "v{{ .Major }}.{{ .Minor }}", "v{{ .Major }}", latest]
    # The source label links the package to the repository on GitHub.
    labels:
      org.opencontainers.image.source: https://github.com/akamachinecode/exhale
      org.opencontainers.image.title: Exhale
      org.opencontainers.image.description: Self-hosted subscription manager where the reminder is the interface.
      org.opencontainers.image.licenses: AGPL-3.0-or-later
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.created: "{{ .Date }}"
release:
  extra_files:
    - glob: ./installers/*
changelog:
  disable: true # release-please writes CHANGELOG.md
