version: "2"
linters:
  enable:
    - bodyclose
    - errcheck
    - exhaustive
    - gosec
    - govet
    - ineffassign
    - misspell
    - staticcheck
    - unused
  settings:
    errcheck:
      exclude-functions:
        - (io.Closer).Close
        - (*database/sql.DB).Close
        - (*database/sql.Tx).Rollback
        - (*github.com/akamachinecode/exhale/internal/store.Store).Close
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        - (net/http.ResponseWriter).Write
        - (*encoding/json.Encoder).Encode
    exhaustive:
      default-signifies-exhaustive: true
    gosec:
      excludes:
        - G104 # covered by errcheck
  exclusions:
    rules:
      - path: _test\.go
        linters: [errcheck, gosec, bodyclose]
      - path: internal/(store/db|testutil)/
        linters: [gosec]
      # Spanish text is neither misspelled English nor a credential.
      - path: i18n_es\.go
        linters: [misspell, gosec]
