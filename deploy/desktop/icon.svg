<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <!-- The app icon of the installers (ADR 0029): the web's icon on Apple's
       1024 grid, an 824 px rounded square with room for its shadow. -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="0.6">
      <stop offset="0" stop-color="#c4a5f5"/>
      <stop offset="0.5" stop-color="#93c5f5"/>
      <stop offset="1" stop-color="#7ee0c8"/>
    </linearGradient>
    <filter id="s" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#g)" filter="url(#s)"/>
  <g transform="translate(100 100) scale(1.609375)">
    <path d="M152 282c40-80 168-80 208 0" stroke="#0a0a0a" stroke-width="36" fill="none" stroke-linecap="round"/>
    <path d="M192 336c28-40 100-40 128 0" stroke="#0a0a0a" stroke-opacity=".6" stroke-width="30" fill="none" stroke-linecap="round"/>
  </g>
</svg>
