name: Release
on:
  push:
    branches: [main]
permissions: {}
jobs:
  release-please:
    permissions:
      contents: write       # tags, releases, CHANGELOG
      pull-requests: write  # the release PR
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.rp.outputs.release_created }}
      tag: ${{ steps.rp.outputs.tag_name }}
      version: ${{ steps.rp.outputs.version }}
    steps:
      # Versions come from release-please-config.json and
      # .release-please-manifest.json: the first release is 0.1.0, and while
      # below 1.0 a breaking change bumps the minor (ADR 0016). Do not pass
      # release-type here: it would make the action ignore both files.
      - id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
  # Exhale.dmg and Exhale-Setup.exe, tried on a Mac and on Windows first.
  installers:
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    permissions:
      contents: read
    # A reusable workflow in this repository is read from this same commit,
    # not from a checkout.
    uses: ./.github/workflows/installers.yml # zizmor: ignore[self-repository]
    with:
      version: ${{ needs.release-please.outputs.version }}
  goreleaser:
    needs: [release-please, installers]
    if: needs.release-please.outputs.released == 'true'
    permissions:
      contents: write      # upload release assets
      packages: write      # push the image to ghcr.io
      id-token: write      # cosign keyless signing
      attestations: write  # build provenance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          cache: false # a release never uses a cache another run could have written
      # goreleaser runs syft to write the SBOM of each archive.
      - uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
      # Published with the rest and listed in the signed checksums.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: installer-*
          merge-multiple: true
          path: installers
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-checksums: dist/checksums.txt
